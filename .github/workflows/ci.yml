name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore, Release build, and assertion tests
        shell: pwsh
        run: ./build.ps1

      # build.ps1 runs the assertion exe with no extra args, so it never passes
      # --windows. RegisterHotKey uses invisible HwndSource windows, not a shown UI.
      - name: Windows RegisterHotKey checks
        shell: pwsh
        run: ./tests/run-tests.ps1 -Windows

      # -UiSmoke is intentionally omitted. It calls Window.Show(), requires
      # IsVisible and a laid-out 600x620 window, and screenshots that window.
      # That is not a headless test, and a hosted runner has no reliable
      # composited desktop. A failed Show() can also sit in Dispatcher.Run().

  portable:
    name: Portable win-x64 zip
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build portable package
        shell: pwsh
        run: ./build.ps1 -Portable

      - name: Upload portable zip
        uses: actions/upload-artifact@v7
        with:
          name: Suiyi-portable-win-x64
          path: artifacts/Suiyi-v*-win-x64.zip
          if-no-files-found: error
